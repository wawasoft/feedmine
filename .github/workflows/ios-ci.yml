name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'feedmine/**'
      - 'feedmineTests/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'feedmine/**'
      - 'feedmineTests/**'

jobs:
  identity-contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fast identity contract test
        run: |
          xcodebuild test \
            -project feedmine.xcodeproj \
            -scheme feedmine \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:feedmineTests/CatalogIdentityContractTests

  full-suite:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run full unit test suite
        run: |
          xcodebuild test \
            -project feedmine.xcodeproj \
            -scheme feedmine \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -testPlan FeedMine-ReleaseValidation 2>&1 | tee xcodebuild.log
          # Fail if any test failures (allow known infra flakiness)
          if grep -q "Testing failed" xcodebuild.log; then
            echo "::error::Full test suite has failures"
            exit 1
          fi
