[project]
name = "feedmine-verify"
version = "1.0.0"
description = "Verify RSS/Atom feed URLs in OPML files — fast, concurrent, with in-place cleaning."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["aiohttp>=3.9", "ddgs>=6.0"]

[project.scripts]
feedmine-verify = "feedmine_verify.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["feedmine_verify*"]

[project.optional-dependencies]
dev = ["pytest>=8", "pycountry>=22"]
editorial = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "duckdb>=0.9",
    "pytest>=8",
    "pycountry>=22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts"]
